name: first-ci
on: [push, pull_request]
jobs:
  firstci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: python setup
        uses: actions/setup-python@v5
        with:
           python-version: '3.5'
           cache: 'pip'
           cache-dependency-path: requirements.txt
      - name: install deps
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest
